# One entry per work. Citation quality depends on these fields.
#
# Required: id, author, title.
# Optional:
#   url         Page to download with `python main.py fetch`. An index page
#               (index.htm) is crawled for chapters in the same directory.
#   crawl       true or false, to override the index.htm rule.
#   skip        Substrings of linked file names to leave out of the crawl.
#               Study guides and glossaries are always left out.
#   file        File name in texts/. Defaults to <id>.html.
#   source_url  Link shown in the citation. Defaults to url.
#   year, type (book, pamphlet, speech, article, letter), translator.
#
# To add a work you already have as a file, leave out url and set file.

include:
  - castro-db.yaml  # written by `python main.py fetch-castro`
  - library.yaml    # your own copies of books, not committed

